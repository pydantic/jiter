[project]
name = "jiter-workspace"
version = "0.1.0"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "maturin>=1.15",
    "pytest",
    "pytest-pretty",
    "dirty-equals",
]
bench = [
    "orjson",
    "ujson",
]
linting = [
    "ruff",
    # markdown formatting, `make format-md`
    "mdformat",
    "mdformat-tables",
]
pyodide-build = [
    "pyodide-build",
]

[tool.uv]
required-version = ">=0.13.4"
package = false
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["crates/jiter-python"]

[tool.ruff]
target-version = "py311"

[tool.ruff.format]
quote-style = "single"
